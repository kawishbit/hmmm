<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="2400" height="800" viewBox="0 0 2400 800" role="img"
  aria-label="Hmmm — repository banner">
  <title>Hmmm — mono white + magenta accent</title>
  <defs>
    <style>
      .title { font-family: Inter, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif; font-weight: 600; }
      .desc { font-family: Inter, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif; font-weight: 400; }
      .meta { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Soft editorial canvas -->
  <rect width="2400" height="800" fill="#f7f7f5"/>

  <!-- Magenta accent wedge (brand signal) -->
  <polygon points="1520,0 2400,0 2400,800 1320,800" fill="#ff3d8b"/>

  <!-- Type block on light canvas -->
  <text class="meta" x="120" y="280" fill="#6f6f6f" font-size="22">Quote · Layout · Export</text>
  <text class="title" x="120" y="410" fill="#000000" font-size="128" letter-spacing="-4">Hmmm</text>
  <text class="desc" x="120" y="480" fill="#2a2a2a" font-size="30">Full-screen quote image maker — type a quote,</text>
  <text class="desc" x="120" y="524" fill="#2a2a2a" font-size="30">pick a layout, download a PNG. No account.</text>
  <rect x="120" y="570" width="80" height="10" rx="5" fill="#000000"/>

  <!-- Mono-white logo on magenta (light mark needs saturated ground) -->
  <image href="data:image/svg+xml;base64," x="1580" y="140" width="520" height="520" preserveAspectRatio="xMidYMid meet"/>
</svg>
