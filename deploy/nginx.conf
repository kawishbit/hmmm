server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security basics
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed Astro/Vite assets — long cache
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker + generated manifest must revalidate
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /backgrounds/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # App routes — HTML must revalidate so cold loads see new shells
    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /create {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files /create/index.html =404;
    }

    location = /create/index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /create/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /create/index.html =404;
    }

    # Default: static files, then SPA-ish index for unknown paths → 404 page
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 256;
}
